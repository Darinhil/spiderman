      /* Cinematic image reveal: a wipe across the frame while the photo settles from a zoom */
      /* (The clip lives on an inner layer: IntersectionObserver ignores fully clipped targets.) */

      @keyframes curtainTop { 0%, 40% { transform: translateY(0); } 100% { transform: translateY(-101%); } }

      @keyframes heroEnter {

          transition-duration: 0.01ms !important;
        }
      }

        { use: "Movies — Spider-Man 2099 cosplay, SDCC 2023", author: "William Tung", license: "CC BY-SA 2.0", url: "https://commons.wikimedia.org/wiki/File:Spider-Man_2099_Cosplayer_at_the_2023_Comic-Con_International.jpg" },
      ];

      /* ---------- Shared hooks ---------- */

      // A single scroll listener + one animation frame drives every scroll effect on the page.
      const scrollSubscribers = new Set();
      let scrollTicking = false;
      const runScrollSubscribers = () => {
        scrollTicking = false;
        const y = window.scrollY;
        scrollSubscribers.forEach((fn) => fn(y));
      };
      const requestScrollFrame = () => {
        if (!scrollTicking) {
          scrollTicking = true;
          requestAnimationFrame(runScrollSubscribers);
        }
      };
      window.addEventListener("scroll", requestScrollFrame, { passive: true });
      window.addEventListener("resize", requestScrollFrame);

      function useScrollFrame(callback) {
        const callbackRef = useRef(callback);
        callbackRef.current = callback;

        useEffect(() => {
          const subscriber = (y) => callbackRef.current(y);
          scrollSubscribers.add(subscriber);
          subscriber(window.scrollY);
          return () => scrollSubscribers.delete(subscriber);
        }, []);
      }

      // Moves an element relative to its parent's position in the viewport (vertical by default).
      function useParallax(speed = 0.15, scale = 1, axis = "y") {
        const ref = useRef(null);
        useScrollFrame(() => {
          const el = ref.current;
          if (!el || REDUCED_MOTION) return;
          const rect = el.parentElement.getBoundingClientRect();
          if (rect.bottom < 0 || rect.top > window.innerHeight) return;
          const offset = ((rect.top + rect.height / 2 - window.innerHeight / 2) * -speed).toFixed(1);
          el.style.transform = axis === "x" ? `translate3d(${offset}px, 0, 0)` : `translate3d(0, ${offset}px, 0) scale(${scale})`;
        });
        return ref;
      }

      function useInView({ threshold = 0.12, rootMargin = "0px 0px -40px 0px" } = {}) {
        const ref = useRef(null);
        const [visible, setVisible] = useState(REDUCED_MOTION);

        useEffect(() => {
          const el = ref.current;
          if (!el || visible) return;
          const observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                setVisible(true);
                observer.disconnect();
              }
            },
            { threshold, rootMargin }
          );
          observer.observe(el);
          return () => observer.disconnect();
        }, []);

        return [ref, visible];
      }

      function useActiveSection(ids) {
        const [active, setActive] = useState(ids[0]);
        useScrollFrame((y) => {
          const doc = document.documentElement;
          if (window.innerHeight + y >= doc.scrollHeight - 4) {
            setActive(ids[ids.length - 1]);
            return;
          }
          const probe = window.innerHeight * 0.35;
          let current = ids[0];
          for (const id of ids) {
            const el = document.getElementById(id);
            if (el && el.getBoundingClientRect().top <= probe) current = id;
          }
          setActive(current);
        });
        return active;
      }

      function useLockBodyScroll(locked) {
        useEffect(() => {
          if (!locked) return;
          const previous = document.documentElement.style.overflow;
          document.documentElement.style.overflow = "hidden";
          return () => {
            document.documentElement.style.overflow = previous;
          };
        }, [locked]);
      }

      function handleSpotlight(e) {
        const card = e.target.closest("[data-spotlight]");
        if (!card) return;
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
        card.style.setProperty("--my", `${e.clientY - rect.top}px`);
      }

      function handleTilt(e) {
        if (!FINE_POINTER || REDUCED_MOTION) return;
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.setProperty("--ry", `${(px * 9).toFixed(2)}deg`);
        card.style.setProperty("--rx", `${(-py * 9).toFixed(2)}deg`);
      }

      function resetTilt(e) {
        e.currentTarget.style.setProperty("--rx", "0deg");
        e.currentTarget.style.setProperty("--ry", "0deg");
      }

      /* ---------- Building blocks ---------- */

      const REVEAL_HIDDEN = {
        up: "opacity-0 translate-y-10",
        left: "opacity-0 -translate-x-10",
        right: "opacity-0 translate-x-10",
        zoom: "opacity-0 scale-[0.96]",
      };

      function Reveal({ children, className = "", delay = 0, variant = "up" }) {
        const [ref, visible] = useInView();
        return (
          <div
            ref={ref}
            style={{ transitionDelay: `${delay}ms` }}
            className={`transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] ${
              visible ? "is-visible opacity-100 translate-x-0 translate-y-0 scale-100" : REVEAL_HIDDEN[variant]
            } ${className}`}
          >
            {children}
          </div>
        );
      }

      // Responsive WebP image that fades in once loaded and swaps to illustrated art if it fails.
      function SmartImage({ name, widths, src, sizes, alt, imgClassName = "", style, priority = false, fallback = null }) {
        const ref = useRef(null);
        const [status, setStatus] = useState("loading");

        useEffect(() => {
          const img = ref.current;
          if (img && img.complete && img.naturalWidth) setStatus("loaded");
        }, [name, src]);

        if (status === "error" && fallback) return fallback;

        return (
          <img
            ref={ref}
            src={src || IMG(name, widths[0])}
            srcSet={src ? undefined : widths.map((w) => `${IMG(name, w)} ${w}w`).join(", ")}
            sizes={sizes}
            alt={alt}
            loading={priority ? "eager" : "lazy"}
            decoding="async"
            fetchpriority={priority ? "high" : "auto"}
            onLoad={() => setStatus("loaded")}
            onError={() => setStatus("error")}
            style={style}
            className={`${imgClassName} transition-opacity duration-700 ${status === "loaded" ? "opacity-100" : "opacity-0"}`}
          />
        );
      }

      function SplitWords({ text, step = 70, startDelay = 0 }) {
        return text.split(" ").map((word, i) => (
          <React.Fragment key={`${word}-${i}`}>
            <span className="word-mask">
              <span className="word" style={{ transitionDelay: `${startDelay + i * step}ms` }}>{word}</span>
            </span>{" "}
          </React.Fragment>
        ));
      }

      function SectionHeading({ eyebrow, title, description, index, watermark, accent = "red", className = "mb-14 sm:mb-20" }) {
        const [ref, visible] = useInView({ threshold: 0.3 });
        const watermarkRef = useParallax(0.35, 1, "x");
        return (
          <div ref={ref} className={`relative text-center max-w-3xl mx-auto ${visible ? "is-visible" : ""} ${className}`}>
            {watermark && (
              <span aria-hidden="true" className="pointer-events-none select-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[62%]">
                <span ref={watermarkRef} className="text-outline block font-display text-[clamp(6rem,20vw,16rem)] leading-none tracking-[0.06em] whitespace-nowrap will-change-transform">
                  {watermark}
                </span>
              </span>
            )}
            <div className="fade-in-view">
              <p className={`relative inline-flex items-center gap-3 text-[11px] sm:text-xs font-bold uppercase tracking-[0.2em] sm:tracking-[0.3em] whitespace-nowrap mb-5 ${accent === "red" ? "text-spider-red" : "text-sky-400"}`}>
                {index && (
                  <span className="font-display text-sm tracking-[0.2em] text-white px-2 py-0.5 rounded-md border border-white/15 bg-white/[0.04]">{index}</span>
                )}
                <span className="hidden sm:block h-px w-8 bg-current opacity-70" />
                {eyebrow}
                <span className="hidden sm:block h-px w-8 bg-current opacity-70" />
              </p>
            </div>
            <h2 className="relative font-display text-[clamp(2.75rem,7vw,5.25rem)] leading-[0.92] tracking-wide text-white text-glow">
              <SplitWords text={title} startDelay={120} />
            </h2>
            {description && (
              <div className="fade-in-view [transition-delay:350ms]">
                <p className="relative mt-6 mx-auto max-w-2xl text-slate-300/90 text-base sm:text-lg leading-relaxed">{description}</p>
              </div>
            )}
          </div>
        );
      }

      function GradeOverlay() {
        return <div className="grade-overlay absolute inset-0" aria-hidden="true" />;
      }

      // Wipes a photo into view while it settles from a slow zoom.
      function ImageReveal({ children, className = "absolute inset-0", delay = 0 }) {
        const [ref, visible] = useInView({ threshold: 0.2, rootMargin: "0px" });
        return (
          <div ref={ref} className={`reveal-image ${visible ? "is-visible" : ""} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
            <div className="reveal-clip absolute inset-0">
              <div className="reveal-media absolute inset-0">{children}</div>
            </div>
          </div>
        );
      }

      function CountUp({ value, delay = 0, duration = 1800 }) {
        const target = Number(value);
        const [current, setCurrent] = useState(REDUCED_MOTION ? target : 0);

        useEffect(() => {
          if (REDUCED_MOTION) return;
          let frame;
          let start;
          const step = (time) => {
            if (!start) start = time;
            const progress = Math.min((time - start) / duration, 1);
            setCurrent(Math.round(target * (1 - Math.pow(1 - progress, 4))));
            if (progress < 1) frame = requestAnimationFrame(step);
          };
          const timer = setTimeout(() => { frame = requestAnimationFrame(step); }, delay);
          return () => {
            clearTimeout(timer);
            cancelAnimationFrame(frame);
          };
        }, [target]);

        return current;
      }

      // Buttons that lean toward the cursor on desktop.
      function Magnetic({ children, strength = 0.25, className = "" }) {
        const ref = useRef(null);
        if (!FINE_POINTER || REDUCED_MOTION) return <span className={`inline-flex ${className}`}>{children}</span>;

        const onMove = (e) => {
          const rect = ref.current.getBoundingClientRect();
          const x = (e.clientX - (rect.left + rect.width / 2)) * strength;
          const y = (e.clientY - (rect.top + rect.height / 2)) * strength;
          ref.current.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
        };
        const onLeave = () => {
          ref.current.style.transform = "";
        };
        return (
          <span ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className={`magnetic inline-flex ${className}`}>
            {children}
          </span>
        );
      }

      function AnimatedWords({ text, startDelay = 0, step = 80, wordClassName = "" }) {
        return text.split(" ").map((word, i) => (
          <React.Fragment key={`${word}-${i}`}>
            <span className="inline-block overflow-hidden align-bottom pb-[0.06em] -mb-[0.06em]">
              <span className={`animate-word ${wordClassName}`} style={{ animationDelay: `${startDelay + i * step}ms` }}>
                {word}
              </span>
            </span>{" "}
          </React.Fragment>
        ));
      }

      // Lets any button inside a Modal close it with the exit animation.
      const ModalCloseContext = React.createContext(() => {});

      function ModalCloseButton({ className = "", children }) {
        const requestClose = React.useContext(ModalCloseContext);
        return (
          <button type="button" onClick={requestClose} className={className}>
            {children}
          </button>
        );
      }

      function Modal({ onClose, labelledBy, children, className = "" }) {
        const closeRef = useRef(null);
        const panelRef = useRef(null);
        const onCloseRef = useRef(onClose);
        onCloseRef.current = onClose;
        const [closing, setClosing] = useState(false);
        const closingRef = useRef(false);
        useLockBodyScroll(true);

        const requestClose = () => {
          if (closingRef.current) return;
          closingRef.current = true;
          setClosing(true);
          setTimeout(() => onCloseRef.current(), REDUCED_MOTION ? 0 : 270);
        };
        const requestCloseRef = useRef(requestClose);
        requestCloseRef.current = requestClose;

        // Escape closes, Tab stays inside the dialog, and focus returns to whatever opened it.
        useEffect(() => {
          const opener = document.activeElement;
          closeRef.current?.focus();
          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              requestCloseRef.current();
              return;
            }
            if (e.key !== "Tab" || !panelRef.current) return;
            const focusable = panelRef.current.querySelectorAll('button:not([tabindex="-1"]), [href], [tabindex="0"]');
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          };
          document.addEventListener("keydown", onKeyDown);
          return () => {
            document.removeEventListener("keydown", onKeyDown);
            opener?.focus?.({ preventScroll: true });
          };
        }, []);
        return ReactDOM.createPortal(
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby={labelledBy}
            className={`fixed inset-0 z-[100] flex items-center justify-center p-3 sm:p-6 bg-black/85 backdrop-blur-md ${closing ? "animate-fade-out" : "animate-fade-in"}`}
            onClick={requestClose}
          >
            <div ref={panelRef} className={`relative w-full ${closing ? "animate-modal-out" : "animate-modal-in"} ${className}`} onClick={(e) => e.stopPropagation()}>
              <button
                ref={closeRef}
                type="button"
                onClick={requestClose}
                aria-label="Close"
                className="absolute top-3 right-3 sm:top-4 sm:right-4 z-20 w-10 h-10 rounded-full bg-black/50 hover:bg-spider-red border border-white/15 text-white flex items-center justify-center transition-all duration-300 hover:rotate-90"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" className="w-4 h-4">
                  <path strokeLinecap="round" d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>
              <ModalCloseContext.Provider value={requestClose}>{children}</ModalCloseContext.Provider>
            </div>
          </div>,
          document.body
        );
      }

      // Cinematic letterbox intro, shown once per visit.
      function IntroCurtain() {
        const [show, setShow] = useState(() => {
          if (REDUCED_MOTION) return false;
          try {
            return !sessionStorage.getItem("mfc-intro-seen");
          } catch {
            return true;
          }
        });

        useEffect(() => {
          if (!show) return;
          try {
            sessionStorage.setItem("mfc-intro-seen", "1");
          } catch {}
          const timer = setTimeout(() => setShow(false), 1700);
          return () => clearTimeout(timer);
        }, []);

        if (!show) return null;
        return (
          <div aria-hidden="true" className="fixed inset-0 z-[120] pointer-events-none">
            <div className="intro-top absolute inset-x-0 top-0 h-1/2 bg-[#020308] border-b border-spider-red/50 shadow-[0_10px_40px_rgba(230,36,41,0.25)]" />
            <div className="intro-bottom absolute inset-x-0 bottom-0 h-1/2 bg-[#020308] border-t border-spider-red/50 shadow-[0_-10px_40px_rgba(230,36,41,0.25)]" />
            <div className="intro-mark absolute inset-0 flex flex-col items-center justify-center">
              <SpiderLogo className="w-16 h-16 text-spider-red drop-shadow-[0_0_25px_rgba(230,36,41,0.9)]" />
              <p className="mt-4 font-display text-lg sm:text-xl tracking-[0.5em] text-white/80 text-center px-4">MY FAVORITE CHARACTER</p>
            </div>
          </div>
        );
      }

      // A fine web that trails the cursor on desktop; drawn on one canvas and idle when the mouse is still.
      function WebCursorTrail() {
        const canvasRef = useRef(null);
        const enabled = FINE_POINTER && !REDUCED_MOTION;

        useEffect(() => {
          if (!enabled) return;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext("2d");
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const LIFE = 650;
          const points = [];
          let frame = 0;

          const resize = () => {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          };

          const draw = () => {
            const now = performance.now();
            while (points.length && now - points[0].t > LIFE) points.shift();
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.lineCap = "round";
            for (let i = 1; i < points.length; i++) {
              const p = points[i];
              const fade = 1 - (now - p.t) / LIFE;
              ctx.strokeStyle = `rgba(255,255,255,${(0.42 * fade).toFixed(3)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(points[i - 1].x, points[i - 1].y);
              ctx.lineTo(p.x, p.y);
              ctx.stroke();
              // Cross-strands between older points give the trail its web structure.
              if (i >= 4 && i % 2 === 0) {
                const q = points[i - 4];
                ctx.strokeStyle = `rgba(230,36,41,${(0.28 * fade).toFixed(3)})`;
                ctx.beginPath();
                ctx.moveTo(q.x, q.y);
                ctx.quadraticCurveTo((q.x + p.x) / 2 + 6, (q.y + p.y) / 2 + 6, p.x, p.y);
                ctx.stroke();
              }
            }
            frame = points.length ? requestAnimationFrame(draw) : 0;
          };

          const onMove = (e) => {
            points.push({ x: e.clientX, y: e.clientY, t: performance.now() });
            if (points.length > 26) points.shift();
            if (!frame) frame = requestAnimationFrame(draw);
          };

          resize();
          window.addEventListener("resize", resize);
          window.addEventListener("pointermove", onMove, { passive: true });
          return () => {
            window.removeEventListener("resize", resize);
            window.removeEventListener("pointermove", onMove);
            cancelAnimationFrame(frame);
          };
        }, []);

        if (!enabled) return null;
        return <canvas ref={canvasRef} aria-hidden="true" className="fixed inset-0 w-full h-full z-[95] pointer-events-none" />;
      }

      function SpiderLogo({ className = "w-7 h-7" }) {
        return (
          <svg viewBox="0 0 64 64" fill="currentColor" className={className} aria-hidden="true">
            <ellipse cx="32" cy="24" rx="5" ry="6.5" />

            <path
              d="M27 25C18 20 14 11 12 6M37 25C46 20 50 11 52 6M26 29C15 27 9 22 6 17M38 29C49 27 55 22 58 17M26 34C15 36 9 43 7 52M38 34C49 36 55 43 57 52M27 39C20 45 18 52 19 59M37 39C44 45 46 52 45 59"
              fill="none"
              stroke="currentColor"

      function WebRing({ className = "", fine = false }) {
        const stroke = fine ? { vectorEffect: "non-scaling-stroke" } : undefined;

      function Logo() {
        return (
          <a href="#home" aria-label="My Favorite Character — back to top" className="group flex items-center gap-3 shrink-0">
            <span className="relative w-11 h-11 grid place-items-center">
              <span className="absolute inset-0 rounded-full bg-spider-red shadow-[0_0_22px_rgba(230,36,41,0.6)] group-hover:shadow-[0_0_34px_rgba(230,36,41,0.95)] transition-shadow duration-300" />
              <WebRing className="absolute inset-0 w-full h-full text-black/30 animate-[spin_24s_linear_infinite] group-hover:[animation-duration:4s]" />
              <SpiderLogo className="relative w-6 h-6 text-spider-ink group-hover:scale-110 transition-transform duration-300" />
            </span>
            <span className="leading-none">
              <span className="block text-[10px] font-bold tracking-[0.38em] text-slate-400 group-hover:text-slate-200 transition-colors">MY FAVORITE</span>
              <span className="block font-display text-[26px] tracking-[0.1em] text-white mt-0.5">
                CHARACTER<span className="text-spider-red">.</span>
              </span>

      function Navbar() {
        const [scrolled, setScrolled] = useState(false);

        const listRef = useRef(null);
        const [indicator, setIndicator] = useState(null);
        const active = useActiveSection(SECTION_IDS);

        // Slide a single pill between links instead of swapping backgrounds.
        useEffect(() => {
          const update = () => {
            const item = listRef.current?.querySelector(`a[href="#${active}"]`)?.parentElement;
            if (item) setIndicator({ left: item.offsetLeft, width: item.offsetWidth });
          };
          update();
          document.fonts?.ready.then(update);
          window.addEventListener("resize", update);
          return () => window.removeEventListener("resize", update);
        }, [active]);

        useScrollFrame((y) => {
          setScrolled(y > 36);
          const max = document.documentElement.scrollHeight - window.innerHeight;
          if (progressRef.current) progressRef.current.style.transform = `scaleX(${max > 0 ? Math.min(y / max, 1) : 0})`;
        });

        useLockBodyScroll(menuOpen);

        useEffect(() => {
          if (!menuOpen) return;
          const onKeyDown = (e) => { if (e.key === "Escape") setMenuOpen(false); };
          const onResize = () => { if (window.innerWidth >= 1024) setMenuOpen(false); };
          window.addEventListener("keydown", onKeyDown);
          window.addEventListener("resize", onResize);
          return () => {
            window.removeEventListener("keydown", onKeyDown);
            window.removeEventListener("resize", onResize);
          };
        }, [menuOpen]);

        const solid = scrolled || menuOpen;

        return (
          <>
            <div
              aria-hidden="true"
              onClick={() => setMenuOpen(false)}
              className={`lg:hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm transition-opacity duration-300 ${menuOpen ? "opacity-100" : "opacity-0 pointer-events-none"}`}

                    <span

                      className="absolute top-1 bottom-1 rounded-full bg-spider-red shadow-[0_0_18px_rgba(230,36,41,0.55)] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]"
                      style={{ left: indicator.left, width: indicator.width }}

                  {NAV_LINKS.map((link) => {
                    const isActive = active === link.href.slice(1);

                      <li key={link.href} className="relative">
                        <a

                          className={`relative block px-3.5 xl:px-4 py-2 rounded-full text-[13px] font-semibold tracking-wide transition-colors duration-300 after:absolute after:left-1/2 after:-translate-x-1/2 after:bottom-1 after:h-px after:w-0 after:bg-spider-red after:transition-all after:duration-300 ${
                            isActive ? "text-white" : "text-slate-300 hover:text-white hover:bg-white/[0.08] hover:after:w-1/2"

                        >

      const PARTICLES = Array.from({ length: 16 }, (_, i) => ({

      }));

      function Hero() {
        const bgRef = useParallax(0.25, 1.06);
        const sectionRef = useRef(null);
        const contentRef = useRef(null);
        const frame = useRef(0);

        // Content drifts up and fades as the hero scrolls away, like a title card leaving the frame.
        useScrollFrame((y) => {
          const el = contentRef.current;
          if (!el || REDUCED_MOTION) return;
          const progress = Math.min(y / window.innerHeight, 1);
          el.style.opacity = String(Math.max(1 - progress * 1.5, 0));
          el.style.transform = `translate3d(0, ${(progress * 110).toFixed(1)}px, 0) scale(${(1 - progress * 0.06).toFixed(3)})`;
        });

        const onMouseMove = (e) => {
          if (REDUCED_MOTION || frame.current) return;
          const { clientX, clientY } = e;
          frame.current = requestAnimationFrame(() => {
            frame.current = 0;
            const el = sectionRef.current;
            if (!el) return;
            el.style.setProperty("--px", (clientX / window.innerWidth - 0.5).toFixed(3));
            el.style.setProperty("--py", (clientY / window.innerHeight - 0.5).toFixed(3));
          });
        };
        const drift = (depth) => ({
          transform: `translate3d(calc(var(--px, 0) * ${depth}px), calc(var(--py, 0) * ${depth}px), 0)`,
          transition: "transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)",
        });

        return (
          <section id="home" ref={sectionRef} onMouseMove={onMouseMove} className="relative isolate min-h-[100svh] flex items-center justify-center pt-28 pb-28 overflow-hidden">
            <div className="absolute inset-0 -z-10 bg-spider-ink">
              <div ref={bgRef} className="absolute inset-0 will-change-transform">
                <SmartImage
                  name="hero"
                  widths={[1920, 960]}

                  fallback={<HeroSkylineArtwork />}
                />

              <GradeOverlay />
              <div className="absolute inset-0 bg-gradient-to-b from-spider-ink/80 via-spider-ink/45 to-spider-ink" />

      function MoviesSection() {
        const ERAS = ["All", "Raimi Trilogy", "Amazing Era", "MCU", "Spider-Verse"];
        const [selectedEra, setSelectedEra] = useState("All");
        const [activeIndex, setActiveIndex] = useState(null);
        const [slide, setSlide] = useState(0);
        const trackRef = useRef(null);
        const filteredMovies = selectedEra === "All" ? MOVIES : MOVIES.filter((m) => m.era === selectedEra);
        const activeMovie = activeIndex !== null ? filteredMovies[activeIndex] : null;
        const stepMovie = (dir) => setActiveIndex((i) => (i + dir + filteredMovies.length) % filteredMovies.length);

        const chooseEra = (era) => {
          setSelectedEra(era);
          setSlide(0);
          trackRef.current?.scrollTo({ left: 0, behavior: "smooth" });
        };

        // Mobile carousel: track which card is centred so the dots stay in sync.
        const onTrackScroll = (e) => {
          const track = e.currentTarget;
          const card = track.firstElementChild;
          if (!card) return;
          const centre = track.scrollLeft + track.clientWidth / 2 - card.offsetLeft - card.offsetWidth / 2;
          setSlide(Math.max(0, Math.round(centre / (card.offsetWidth + 16))));
        };
        const goToSlide = (idx) => {
          const track = trackRef.current;
          const card = track?.children[idx];
          if (card) track.scrollTo({ left: card.offsetLeft - (track.clientWidth - card.offsetWidth) / 2, behavior: "smooth" });
        };

        useEffect(() => {
          if (activeIndex === null) return;
          const onKeyDown = (e) => {
            if (e.key === "ArrowRight") stepMovie(1);
            if (e.key === "ArrowLeft") stepMovie(-1);
          };
          window.addEventListener("keydown", onKeyDown);
          return () => window.removeEventListener("keydown", onKeyDown);
        }, [activeIndex, filteredMovies.length]);

        return (
          <section id="movies" className="relative py-24 sm:py-32 bg-web-pattern overflow-hidden">
            <div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-spider-red/50 to-transparent" />

              />

              <Reveal>
                <div className="flex justify-center mb-10 sm:mb-12">
                  <div role="group" aria-label="Filter movies by era" className="flex flex-wrap justify-center gap-1.5 p-1.5 rounded-2xl sm:rounded-full bg-white/[0.04] border border-white/10 backdrop-blur-md">
                    {ERAS.map((era) => {
                      const count = era === "All" ? MOVIES.length : MOVIES.filter((m) => m.era === era).length;
                      const isActive = selectedEra === era;

      function GallerySection() {
        const [selectedIndex, setSelectedIndex] = useState(null);
        const touchStart = useRef(null);
        const total = GALLERY_ITEMS.length;
        const showPrev = () => setSelectedIndex((p) => (p - 1 + total) % total);
        const showNext = () => setSelectedIndex((p) => (p + 1) % total);

        useEffect(() => {
          if (selectedIndex === null) return;
          const onKeyDown = (e) => {
            if (e.key === "ArrowRight") showNext();
            if (e.key === "ArrowLeft") showPrev();
          };
          window.addEventListener("keydown", onKeyDown);
          return () => window.removeEventListener("keydown", onKeyDown);
        }, [selectedIndex]);

        const onTouchEnd = (e) => {
          if (touchStart.current === null) return;
          const dx = e.changedTouches[0].clientX - touchStart.current;
          if (Math.abs(dx) > 50) (dx < 0 ? showNext : showPrev)();
          touchStart.current = null;
        };

        const activeItem = selectedIndex !== null ? GALLERY_ITEMS[selectedIndex] : null;

        return (
          <section id="gallery" className="relative py-24 sm:py-32 bg-gradient-to-b from-spider-ink via-spider-navy/35 to-spider-ink overflow-hidden">
            <div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-sky-400/40 to-transparent" />
            <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <SectionHeading
                index="04"
                watermark="GALLERY"
                eyebrow="Visual Showcase"
                accent="blue"
                title="THE SPIDER-MAN GALLERY"
                description="Iconic suits, soaring Manhattan swings, Peter Parker moments, and dramatic villain clashes. Click any frame to inspect it in full-screen lightbox view."
              />

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 auto-rows-[250px] sm:auto-rows-[270px] gap-4 sm:gap-5">
                {GALLERY_ITEMS.map((item, idx) => (
                  <Reveal key={item.id} delay={idx * 60} className={`h-full ${GALLERY_LAYOUT[idx]}`}>
                    <button
                      type="button"
                      onClick={() => setSelectedIndex(idx)}
                      aria-label={`Open ${item.title} in lightbox`}
                      className="gradient-border group relative block w-full h-full rounded-2xl overflow-hidden border border-white/5 hover:border-spider-red/70 text-left shadow-[0_20px_50px_rgba(0,0,0,0.5)] hover:shadow-[0_24px_60px_rgba(230,36,41,0.22)] transition-all duration-500"
                    >
                      <ImageReveal delay={150 + (idx % 3) * 120}>
                        <div className="absolute inset-0 z-0">
                          <GallerySceneArt item={item} />
                        </div>
                        <SmartImage
                          name={item.image}
                          widths={[1280, 640]}
                          sizes={idx === 0 ? "(min-width: 1024px) 66vw, 100vw" : "(min-width: 1024px) 33vw, (min-width: 640px) 50vw, 100vw"}
                          alt={`${item.title} — ${item.category}`}
                          style={{ objectPosition: item.focus }}
                          imgClassName="img-grade absolute inset-0 w-full h-full object-cover transition-transform duration-[1100ms] ease-out group-hover:scale-110"
                        />
                        <GradeOverlay />
                      </ImageReveal>
                      <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-black/10" />
                      <div className="absolute inset-0 bg-spider-red/0 group-hover:bg-spider-red/10 transition-colors duration-500 mix-blend-overlay" />
                      <span className="absolute top-4 left-4 px-2.5 py-1 rounded-full bg-black/55 border border-white/15 backdrop-blur-sm text-[10px] font-semibold uppercase tracking-[0.2em] text-sky-300">
                        {item.category}
                      </span>
                      <span className="absolute top-4 right-4 w-10 h-10 rounded-full bg-spider-red text-white flex items-center justify-center opacity-0 scale-75 group-hover:opacity-100 group-hover:scale-100 transition-all duration-300 shadow-[0_0_20px_rgba(230,36,41,0.6)]" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />

                      </span>
                      <div className="absolute inset-x-0 bottom-0 p-5 sm:p-6 transition-transform duration-500 group-hover:-translate-y-1">
                        <h3 className={`font-heading font-bold text-white group-hover:text-[#ff8a8d] transition-colors ${idx === 0 ? "text-xl sm:text-3xl" : "text-lg"}`}>{item.title}</h3>
                        <p className={`text-slate-300 mt-1 ${idx === 0 ? "text-sm sm:text-base max-w-lg" : "text-xs"}`}>{item.caption}</p>
                        <span className="mt-2 inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-sky-300">
                          Open Lightbox <ArrowIcon className="w-3 h-3 transition-transform duration-300 group-hover:translate-x-1" />
                        </span>
                      </div>
                    </button>
                  </Reveal>
                ))}

                  <div

                      <GallerySceneArt item={activeItem} />

                    <div key={activeItem.id} className="absolute inset-0 animate-zoom-in">

                    <button type="button" onClick={showPrev} aria-label="Previous image" className="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-black/55 hover:bg-spider-red border border-white/15 text-white flex items-center justify-center transition">
                      <ArrowIcon direction="left" className="w-5 h-5" />
                    </button>
                    <button type="button" onClick={showNext} aria-label="Next image" className="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-black/55 hover:bg-spider-red border border-white/15 text-white flex items-center justify-center transition">
                      <ArrowIcon className="w-5 h-5" />
                    </button>
                    <span className="absolute bottom-3 left-3 px-2.5 py-1 rounded-full bg-black/60 text-[10px] text-slate-300 tracking-wide">Photo: {activeItem.credit}</span>
                    <span className="absolute bottom-3 right-3 px-2.5 py-1 rounded-full bg-black/60 font-display text-sm tracking-widest text-white">
                      {String(selectedIndex + 1).padStart(2, "0")} / {String(total).padStart(2, "0")}
                    </span>
                  </div>
                  <div className="p-5 sm:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div key={activeItem.id} className="animate-fade-up">
                      <span className="text-xs font-semibold uppercase tracking-widest text-spider-red">{activeItem.category}</span>

                        Next <ArrowIcon className="w-4 h-4" />
                      </button>
                      <ModalCloseButton className={`${BTN.primary} ${BTN_SIZE.sm}`}>Close</ModalCloseButton>
                    </div>
                  </div>
                  <div className="hidden sm:flex gap-2 px-6 pb-6 overflow-x-auto no-scrollbar">
                    {GALLERY_ITEMS.map((thumb, idx) => (
                      <button
                        key={thumb.id}

                        onClick={() => setSelectedIndex(idx)}

                        <img src={IMG(thumb.image, 640)} alt="" loading="lazy" className="w-full h-full object-cover" style={{ objectPosition: thumb.focus }} />
                      </button>
                    ))}
                  </div>
                </div>
              </Modal>
            )}

        );

      function BackToTop() {
        const [visible, setVisible] = useState(false);
        const ringRef = useRef(null);
        const CIRCUMFERENCE = 2 * Math.PI * 22;

        useScrollFrame((y) => {
          setVisible(y > 500);
          const max = document.documentElement.scrollHeight - window.innerHeight;
          if (ringRef.current) ringRef.current.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - (max > 0 ? Math.min(y / max, 1) : 0)));
        });

        return (
          <button
            type="button"
            onClick={() => window.scrollTo({ top: 0, behavior: REDUCED_MOTION ? "auto" : "smooth" })}
            aria-label="Back to top"
            className={`group fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-40 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-spider-ink/80 backdrop-blur-md text-white flex items-center justify-center transition-all duration-300 hover:shadow-[0_0_30px_rgba(230,36,41,0.7)] ${
              visible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-6 pointer-events-none"
            }`}
          >
            <svg viewBox="0 0 48 48" className="absolute inset-0 w-full h-full -rotate-90" aria-hidden="true">
              <circle cx="24" cy="24" r="22" fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="2" />
              <circle ref={ringRef} cx="24" cy="24" r="22" fill="none" stroke="#E62429" strokeWidth="2.5" strokeLinecap="round" strokeDasharray={CIRCUMFERENCE} strokeDashoffset={CIRCUMFERENCE} />
            </svg>
            <span className="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-spider-red group-hover:bg-spider-hot flex items-center justify-center transition-colors">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" className="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5">
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" />
              </svg>
            </span>
          </button>
        );
      }

      function App() {

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
