      function Reveal({ children, className = "", delay = 0 }) {
        const ref = useRef(null);
        const [visible, setVisible] = useState(false);

        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                setVisible(true);
                observer.unobserve(el);
              }
            },
            { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
          );
          observer.observe(el);
          return () => observer.disconnect();
        }, []);

        return (
          <div
            ref={ref}
            style={{ transitionDelay: `${delay}ms` }}
            className={`transition-all duration-700 ease-out ${
              visible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-8"
            } ${className}`}
          >
            {children}
          </div>
        );
      }

                <div className="text-center max-w-3xl mx-auto mb-14">
                  <p className="text-xs font-bold uppercase tracking-[0.25em] text-sky-400 mb-3">Visual Showcase</p>
                  <h2 className="font-display text-4xl sm:text-6xl tracking-wide text-white">THE SPIDER-MAN GALLERY</h2>
                  <p className="mt-4 text-slate-300 text-base sm:text-lg">
                    Iconic suits, soaring Manhattan swings, Peter Parker moments, and dramatic villain clashes. Click any frame to inspect it in full-screen lightbox view.
                  </p>
                </div>
              </Reveal>

              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {GALLERY_ITEMS.map((item, idx) => (
                  <Reveal key={item.id} delay={idx * 75}>
                    <button
                      type="button"
                      onClick={() => setSelectedIndex(idx)}
                      className="group relative w-full aspect-[4/3] rounded-2xl overflow-hidden border border-white/10 hover:border-[#E62429]/70 text-left shadow-lg"
                    >
                      <div className="w-full h-full transition-transform duration-500 group-hover:scale-105">
                        <GallerySceneArt item={item} />
                      </div>
                      <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/35 to-transparent p-5 flex flex-col justify-end">
                        <h3 className="font-heading text-lg font-bold text-white group-hover:text-[#ff6b6f] transition-colors">{item.title}</h3>
                        <p className="text-xs text-slate-300 mt-1">{item.caption}</p>
                        <span className="mt-2 inline-flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wider text-sky-300">Open Lightbox →</span>
                      </div>
                    </button>
                  </Reveal>
                ))}
              </div>
            </div>

            {activeItem && (
              <div role="dialog" aria-modal="true" className="fixed inset-0 z-50 bg-black/90 backdrop-blur-lg flex items-center justify-center p-4" onClick={() => setSelectedIndex(null)}>
                <div className="relative max-w-4xl w-full rounded-3xl overflow-hidden bg-[#0B1220] border border-white/15 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                  <div className="relative aspect-[16/10] w-full">
                    <GallerySceneArt item={activeItem} />
                  </div>
                  <div className="p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-semibold uppercase tracking-widest text-[#E62429]">{activeItem.category}</span>
                      <h3 className="font-display text-3xl text-white mt-1">{activeItem.title}</h3>
                      <p className="text-sm text-slate-300 mt-1">{activeItem.caption}</p>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button type="button" onClick={() => setSelectedIndex((p) => (p - 1 + GALLERY_ITEMS.length) % GALLERY_ITEMS.length)} className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm font-medium transition">← Prev</button>
                      <button type="button" onClick={() => setSelectedIndex((p) => (p + 1) % GALLERY_ITEMS.length)} className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm font-medium transition">Next →</button>
                      <button type="button" onClick={() => setSelectedIndex(null)} className="px-4 py-2 rounded-xl bg-[#E62429] hover:bg-[#c81d22] text-white text-sm font-semibold transition">Close</button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </section>
        );
      }

      function QuotesSection() {
        return (
          <section id="quotes" className="relative py-24 sm:py-32 bg-web-pattern border-t border-white/5 overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(230,36,41,0.14),transparent_65%)] pointer-events-none" />
            <div className="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <Reveal>
                <div className="text-center max-w-3xl mx-auto mb-16">
                  <p className="text-xs font-bold uppercase tracking-[0.25em] text-[#E62429] mb-3">Philosophy Beneath the Mask</p>
                  <h2 className="font-display text-4xl sm:text-6xl tracking-wide text-white">WORDS OF A HERO</h2>
                </div>
              </Reveal>
              <div className="grid md:grid-cols-3 gap-6">
                {QUOTES.map((item, idx) => (
                  <Reveal key={item.id} delay={idx * 110}>
                    <blockquote className="group h-full relative rounded-3xl p-8 bg-gradient-to-br from-[#071B35]/85 via-[#0B1220] to-[#1A090F] border border-white/10 hover:border-[#E62429]/60 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1.5 shadow-xl">
                      <div>
                        <span className="font-display text-7xl leading-none text-[#E62429]/60 block -mb-4 select-none" aria-hidden="true">“</span>
                        <p className="font-heading text-xl sm:text-2xl font-bold text-white leading-snug">{item.quote}</p>
                      </div>
                      <footer className="mt-8 pt-5 border-t border-white/10">
                        <cite className="not-italic font-semibold text-sky-300 text-sm block">— {item.author}</cite>
                        <p className="text-xs text-slate-400 mt-1">{item.context}</p>
                      </footer>
                    </blockquote>
                  </Reveal>
                ))}
              </div>
            </div>
          </section>
        );
      }

      function VillainsSection() {
        return (
          <section id="villains" className="relative py-24 sm:py-32 bg-gradient-to-b from-[#080B12] via-[#071B35]/35 to-[#080B12]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <Reveal>
                <div className="text-center max-w-3xl mx-auto mb-16">
                  <p className="text-xs font-bold uppercase tracking-[0.25em] text-[#E62429] mb-3">Rogue’s Gallery</p>
                  <h2 className="font-display text-4xl sm:text-6xl tracking-wide text-white">THE GREATEST ENEMIES</h2>
                  <p className="mt-4 text-slate-300 text-base sm:text-lg">
                    Every great hero is forged by formidable foes—brilliant minds, symbiote monsters, and elemental forces pushing Peter Parker to his absolute limits.
                  </p>
                </div>
              </Reveal>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {VILLAINS.map((villain, idx) => (
                  <Reveal key={villain.id} delay={idx * 80}>
                    <article className="group h-full rounded-2xl bg-[#0B1220] border border-white/10 hover:border-white/25 overflow-hidden transition-all duration-300 hover:-translate-y-1.5 shadow-xl flex flex-col">
                      <VillainArt villain={villain} />
                      <div className="p-6 flex-1 flex flex-col">
                        <h3 className="font-display text-3xl tracking-wide text-white">{villain.name}</h3>
                        <p className="mt-2 text-xs font-semibold uppercase tracking-wider text-sky-300">
                          Abilities: <span className="text-slate-300 normal-case font-normal">{villain.abilities}</span>
                        </p>
                        <p className="mt-3 text-sm text-slate-300 leading-relaxed flex-1">{villain.description}</p>
                      </div>
                    </article>
                  </Reveal>
                ))}
              </div>
            </div>
          </section>
        );
      }

      function Footer() {
        return (
          <footer className="relative overflow-hidden bg-[#05080F] border-t border-white/10 pt-16 pb-10">
            <WebCornerDecoration className="absolute bottom-0 right-0 w-48 h-48 text-[#E62429]/15 rotate-180 pointer-events-none" />
            <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid md:grid-cols-3 gap-10 pb-12 border-b border-white/10">
                <div>
                  <a href="#home" className="inline-flex items-center gap-3">
                    <span className="w-10 h-10 rounded-xl bg-[#E62429] flex items-center justify-center">
                      <SpiderLogo className="w-6 h-6 text-white" />
                    </span>
                    <span className="font-display text-2xl tracking-wider text-white">
                      MY FAVORITE <span className="text-[#E62429]">CHARACTER</span>
                    </span>
                  </a>
                  <p className="mt-4 text-sm text-slate-400 leading-relaxed max-w-sm">
                    A cinematic tribute celebrating Spider-Man (Peter Parker)—his origins in Queens, his extraordinary powers, and his unforgettable legacy across comics and cinema.
                  </p>
                </div>
                <div>
                  <h3 className="font-heading text-sm font-bold uppercase tracking-widest text-white mb-4">Quick Navigation</h3>
                  <ul className="grid grid-cols-2 gap-2.5 text-sm">
                    {NAV_LINKS.map((link) => (
                      <li key={link.href}>
                        <a href={link.href} className="text-slate-400 hover:text-[#E62429] transition">{link.label}</a>
                      </li>
                    ))}
                    <li><a href="#villains" className="text-slate-400 hover:text-[#E62429] transition">Villains</a></li>
                  </ul>
                </div>
                <div>
                  <h3 className="font-heading text-sm font-bold uppercase tracking-widest text-white mb-4">Connect With Fans</h3>
                  <div className="flex items-center gap-3">
                    {[
                      { name: "X / Twitter", path: "M4 4l16 16M20 4L4 20" },
                      { name: "Instagram", path: "M7 4h10a3 3 0 013 3v10a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3zm5 5a3 3 0 100 6 3 3 0 000-6z" },
                      { name: "YouTube", path: "M4 8a3 3 0 013-3h10a3 3 0 013 3v8a3 3 0 01-3 3H7a3 3 0 01-3-3V8zm6 2l5 2.5L10 15v-5z" },
                    ].map((social) => (
                      <a key={social.name} href="#home" aria-label={social.name} className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 hover:border-[#E62429] hover:bg-[#E62429] text-slate-300 hover:text-white flex items-center justify-center transition">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="w-5 h-5">
                          <path strokeLinecap="round" strokeLinejoin="round" d={social.path} />
                        </svg>
                      </a>
                    ))}
                  </div>
                </div>
              </div>
              <p className="pt-8 text-center text-xs text-slate-500">© 2026 My Favorite Character. All rights reserved.</p>
            </div>
          </footer>
        );
      }

      function BackToTop() {
        const [visible, setVisible] = useState(false);
        useEffect(() => {
          const onScroll = () => setVisible(window.scrollY > 500);
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        return (
          <button
            type="button"
            onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
            aria-label="Back to top"
            className={`fixed bottom-6 right-6 z-40 w-12 h-12 rounded-full bg-[#E62429] hover:bg-[#c81d22] text-white shadow-[0_0_24px_rgba(230,36,41,0.6)] flex items-center justify-center transition-all duration-300 ${
              visible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-6 pointer-events-none"
            }`}
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" className="w-5 h-5">
              <path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" />
            </svg>
          </button>
        );
      }

      function App() {
        return (
          <div className="min-h-screen bg-[#080B12] text-white">
            <Navbar />
            <main>
              <Hero />
              <AboutSection />
              <PowersSection />
              <MoviesSection />
              <GallerySection />
              <QuotesSection />
              <VillainsSection />
            </main>
            <Footer />
            <BackToTop />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
